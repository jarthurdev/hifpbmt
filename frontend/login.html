<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Administração HIFPB Monteiro</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="main-content">
    <div class="container">
      <section class="admin-api-access" aria-labelledby="loginHeading">
        <h1 id="loginHeading">Acesso administrativo</h1>
        <p>Entre com as credenciais de administrador para gerenciar a grade acadêmica.</p>
        <form id="adminLoginForm" class="admin-form">
          <div class="form-group">
            <label for="adminLoginEmail" class="form-label">E-mail</label>
            <input id="adminLoginEmail" class="form-control" type="email" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="adminLoginPassword" class="form-label">Senha</label>
            <input id="adminLoginPassword" class="form-control" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary">Entrar</button>
          <a class="btn btn-secondary" href="index.html">Voltar à consulta pública</a>
        </form>
      </section>
    </div>
  </main>
  <div id="toastNotification" class="toast-box" role="status" aria-live="polite">
    <span class="toast-message" id="toastMessage"></span>
  </div>
  <script type="module" src="js/login-app.js"></script>
</body>
</html>
